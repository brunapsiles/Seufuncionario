<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>Seu Funcionário</title>
  </head>
  <body>
    <header class="top">
      <strong>Seu Funcionário</strong>
      <button id="gear" class="icon-btn" title="Configurar" aria-label="Configurar">⚙️</button>
    </header>

    <section id="settings" class="settings hidden">
      <label>
        Endereço do app
        <input id="baseUrl" type="url" placeholder="https://seufuncionario-expo.brunapsiles.workers.dev" />
      </label>
      <label>
        Token de acesso
        <input id="token" type="password" placeholder="Cole aqui o token do app" />
      </label>
      <p class="hint">
        Pegue o token em <strong>Configurações → Extensão do navegador</strong> no
        app e cole aqui. Fica salvo só neste navegador.
      </p>
      <button id="saveSettings" class="btn primary">Salvar</button>
    </section>

    <section id="main">
      <div class="modes">
        <button class="mode" data-mode="summary">Resumir a página</button>
        <button class="mode" data-mode="translate">Traduzir seleção</button>
        <button class="mode" data-mode="reply">Responder mensagem</button>
        <button class="mode" data-mode="explain">Explicar seleção</button>
      </div>
      <textarea id="question" rows="2" placeholder="Ou faça uma pergunta sobre esta página..."></textarea>
      <button id="ask" class="btn primary block">Perguntar</button>

      <div id="status" class="status hidden"></div>
      <div id="result" class="result hidden"></div>
      <button id="copy" class="btn ghost block hidden">Copiar resposta</button>
    </section>

    <script type="module" src="popup.js"></script>
  </body>
</html>
