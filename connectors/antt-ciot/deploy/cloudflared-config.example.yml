# Exemplo para publicar o conector local com HTTPS via Cloudflare Tunnel.
# Ajuste tunnel, credentials-file e hostname antes de instalar o servico cloudflared.
tunnel: <TUNNEL_ID>
credentials-file: C:\Cloudflared\<TUNNEL_ID>.json

ingress:
  - hostname: ciot.todogreen.com.br
    service: http://127.0.0.1:8088
  - service: http_status:404
